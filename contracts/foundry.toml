[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 10_000
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 512

[rpc_endpoints]
bot_mainnet = "${BOT_MAINNET_RPC_URL}"

# Verification on BOTScan (Blockscout-style explorers). Re-check the API URL against
# https://dev-docs.botchain.ai/docs/Developers/quick-guide/ before using it.
